<div class="signup-container">
  <div class="signup-card">
    <h2 class="signup-title">Create a New Account</h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="signup-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          formControlName="username"
          type="text"
          required
          class="form-input"
          placeholder="Choose a username"
        >
        <div *ngIf="signupForm.get('username')?.invalid && (signupForm.get('username')?.dirty || signupForm.get('username')?.touched)"
             class="error-message">
          Username is required.
        </div>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          required
          class="form-input"
          placeholder="Enter your password (min 6 characters)"
        >
        <div *ngIf="signupForm.get('password')?.errors?.['required'] && (signupForm.get('password')?.dirty || signupForm.get('password')?.touched)"
             class="error-message">
          Password is required.
        </div>
        <div *ngIf="signupForm.get('password')?.errors?.['minlength'] && (signupForm.get('password')?.dirty || signupForm.get('password')?.touched)"
             class="error-message">
          Password must be at least 6 characters.
        </div>
      </div>
      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input
          id="confirmPassword"
          formControlName="confirmPassword"
          type="password"
          required
          class="form-input"
          placeholder="Confirm your password"
        >
        <div *ngIf="signupForm.get('confirmPassword')?.invalid && (signupForm.get('confirmPassword')?.dirty || signupForm.get('confirmPassword')?.touched)"
             class="error-message">
          Confirm password is required.
        </div>
        <div *ngIf="signupForm.errors?.['mismatch'] && (signupForm.get('confirmPassword')?.dirty || signupForm.get('confirmPassword')?.touched)"
             class="error-message">
          Passwords do not match.
        </div>
      </div>
      <p *ngIf="errorMessage" class="general-error-message error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="general-error-message success">{{ successMessage }}</p>
      <div>
        <button
          type="submit"
          [disabled]="signupForm.invalid"
          class="submit-button"
          [class.disabled-button]="signupForm.invalid"
        >
          Sign Up
        </button>
      </div>
    </form>
    <p class="login-link-text">
      Already have an account? <a routerLink="/login" class="login-link">Login here</a>
    </p>
  </div>
</div>

<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Login to Your Account</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          formControlName="username"
          type="text"
          required
          class="form-input"
          placeholder="Enter your username"
        >
        <div *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)"
             class="error-message">
          Username is required.
        </div>
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          required
          class="form-input"
          placeholder="Enter your password"
        >
        <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)"
             class="error-message">
          Password is required.
        </div>
      </div>
      <p *ngIf="errorMessage" class="general-error-message">{{ errorMessage }}</p>
      <div>
        <button
          type="submit"
          [disabled]="loginForm.invalid"
          class="submit-button"
          [class.disabled-button]="loginForm.invalid"
        >
          Sign In
        </button>
      </div>
    </form>
    <p class="login-hint">
      Hint: Use 'user' for username and 'password' for password.
    </p>
    <p class="signup-link-text">
      Don't have an account? <a routerLink="/signup" class="signup-link">Sign Up</a>
    </p>
  </div>
</div>

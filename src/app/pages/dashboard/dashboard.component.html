<div class="dashboard-container">
  <div class="dashboard-content-wrapper">
    <h1 class="dashboard-title">Dashboard Overview</h1>
    <p class="dashboard-subtitle">
      Welcome to your personalized dashboard! Here's a summary of your key metrics.
    </p>

    <div class="dashboard-cards-grid">
      <!-- Card 1: Total Users -->
      <div class="dashboard-card blue-card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h-5v-2a3 3 0 013-3h2V9l3-3m-4 0v3m-3 1.5l-3 3v-3m-3-1.5l-3-3v-3m-3-3m0 0v-3m-3 3L3 6m0 0l-3-3" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354v-3.354a1 1 0 011-1h6a1 1 0 011 1v3.354M12 19.646v3.354a1 1 0 001 1h6a1 1 0 001-1v-3.354M12 12a1 1 0 100-2 1 1 0 000 2z" />
          </svg>
        </div>
        <h3 class="card-metric">{{ dashboardData.totalUsers }}</h3>
        <p class="card-label">Total Users</p>
      </div>
      <!-- Card 2: Active Sessions -->
      <div class="dashboard-card green-card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <h3 class="card-metric">{{ dashboardData.activeSessions }}</h3>
        <p class="card-label">Active Sessions</p>
      </div>
      <!-- Card 3: Revenue Today -->
      <div class="dashboard-card yellow-card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
        <h3 class="card-metric">{{ dashboardData.revenueToday }}</h3>
        <p class="card-label">Revenue Today</p>
      </div>
      <!-- Card 4: Pending Tasks -->
      <div class="dashboard-card red-card">
        <div class="card-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
          </svg>
        </div>
        <h3 class="card-metric">{{ dashboardData.pendingTasks }}</h3>
        <p class="card-label">Pending Tasks</p>
      </div>
    </div>

    <div class="dashboard-actions">
      <button
        (click)="onLogout()"
        class="logout-button"
      >
        Logout
      </button>
    </div>
  </div>
</div>
